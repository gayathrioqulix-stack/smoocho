<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmooCho Runner: Sweet Sprint</title>
  <style>
    :root {
      --brand-pink: #E83375;
      --brand-dark: #2B1408;
      --gold: #FFB703;
      --cream: #FFF7EA;
      --mint: #06D6A0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #800E38;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
    }

    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      object-fit: cover;
    }

    canvas#webgl {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Loading Screen */
    #loading-screen {
      position: absolute;
      inset: 0;
      z-index: 50;
      background: radial-gradient(circle at center, #FF5C98 0%, #E83375 70%, #6E052B 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      transition: opacity 0.5s ease;
      padding: 20px;
    }

    .brand-logo {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--cream);
      text-shadow: 0 8px 16px rgba(43, 20, 8, 0.5);
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 30px;
    }

    .progress-bar-container {
      width: 260px;
      height: 16px;
      background: rgba(43, 20, 8, 0.4);
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #FFB703, #FFD166);
      border-radius: 20px;
      transition: width 0.1s linear;
    }

    #start-btn {
      display: none;
      background: var(--cream);
      color: var(--brand-pink);
      font-size: 20px;
      font-weight: 900;
      border: none;
      padding: 16px 48px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(43, 20, 8, 0.4);
      animation: pulse 1.4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    /* In-Game HUD */
    #hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 24px;
    }

    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hud-card {
      background: rgba(43, 20, 8, 0.7);
      border: 2px solid var(--brand-pink);
      border-radius: 30px;
      padding: 8px 18px;
      color: var(--cream);
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 18px;
    }

    .hud-card span.gold {
      color: var(--gold);
    }

    .lives-box {
      display: flex;
      gap: 6px;
    }

    .heart-icon {
      width: 26px;
      height: 26px;
      background: var(--brand-pink);
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset -2px -3px 4px rgba(0,0,0,0.3);
      transition: opacity 0.3s;
    }

    .heart-icon.lost {
      background: #502211;
      opacity: 0.35;
    }

    /* On-Screen Touch Buttons */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .action-btn {
      pointer-events: auto;
      border: none;
      border-radius: 40px;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.35);
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .action-btn:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
    }

    #btn-boost {
      background: linear-gradient(180deg, var(--mint) 0%, #038A65 100%);
      width: 110px;
      height: 60px;
      font-size: 16px;
    }

    #btn-boost.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    #btn-jump {
      background: linear-gradient(180deg, #FF6B8B 0%, var(--brand-pink) 70%, #9E1045 100%);
      width: 170px;
      height: 75px;
      font-size: 24px;
      border: 3px solid var(--cream);
    }

    /* Game Over Modal */
    #gameover-modal {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(43, 20, 8, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      color: var(--cream);
      text-align: center;
      padding: 20px;
    }

    .modal-box {
      background: #3B1608;
      border: 4px solid var(--brand-pink);
      border-radius: 28px;
      padding: 30px 40px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }

    .modal-box h2 {
      font-size: 36px;
      color: var(--brand-pink);
      margin-bottom: 12px;
      font-weight: 900;
    }

    .stat-line {
      font-size: 20px;
      margin: 10px 0;
      font-weight: 700;
    }

    .voucher-pill {
      background: var(--gold);
      color: var(--brand-dark);
      padding: 10px 16px;
      border-radius: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      margin: 20px 0;
      display: inline-block;
    }

    #retry-btn {
      background: var(--brand-pink);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      border: none;
      padding: 14px 40px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 0 #9E1045;
      width: 100%;
    }
  </style>

  <!-- Three.js & GLTFLoader CDNs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="game-container">
    <canvas id="bg-canvas"></canvas>
    <canvas id="webgl"></canvas>

    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="brand-logo">SmooCho</div>
      <div class="brand-subtitle">Sweet Sprint</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="load-progress"></div>
      </div>
      <button id="start-btn">TAP TO ESCAPE</button>
    </div>

    <!-- HUD -->
    <div id="hud">
      <div class="hud-row">
        <div class="lives-box" id="lives-ui">
          <span class="heart-icon"></span>
          <span class="heart-icon"></span>
          <span class="heart-icon"></span>
        </div>
        <div class="hud-card">
          <span>DIST:</span>
          <span class="gold" id="distance-ui">0m</span>
        </div>
        <div class="hud-card">
          <span>🍓</span>
          <span id="boost-ui">2</span>/3
        </div>
      </div>

      <div class="hud-row controls-row">
        <button class="action-btn" id="btn-boost">BOOST!</button>
        <button class="action-btn" id="btn-jump">JUMP! 🪂</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-modal">
      <div class="modal-box">
        <h2>SWEET RUN OVER!</h2>
        <div class="stat-line">Distance: <span class="gold" id="final-dist">0m</span></div>
        <div class="stat-line">Strawberries: <span id="final-strawberries">0</span> 🍓</div>
        <div class="voucher-pill">CODE: SMOOCHO10</div>
        <button id="retry-btn">RETRY RUN 🔁</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. SYNTHESIZED BGM & AUDIO ENGINE
       ========================================================================= */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.isPlaying = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(850, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.16);
      }

      playPickup() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(700, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1100, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.22);
      }

      playCrash() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.28);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.28);
      }

      startBGM() {
        if (!this.ctx || this.isPlaying) return;
        this.isPlaying = true;
        const melody = [330, 392, 440, 523, 659, 523, 440, 392, 440, 523, 587, 659, 784, 880];
        let noteIdx = 0;

        const playNote = () => {
          if (!this.isPlaying) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = melody[noteIdx % melody.length];
          
          gain.gain.setValueAtTime(0.045, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.15);
          
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.17);

          noteIdx++;
          setTimeout(playNote, 145); // Faster tempo matching the increased game speed
        };
        playNote();
      }
    }

    const sound = new SoundEngine();

    /* =========================================================================
       2. SEAMLESS BACKGROUND RENDERING WITH HORIZONTAL BLENDING
       ========================================================================= */
    const bgCanvas = document.getElementById('bg-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    let bgImage = new Image();
    bgImage.src = 'background.png';

    function resizeBg() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    let bgScrollX = 0;
    function renderBackground() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      if (bgImage.complete && bgImage.naturalWidth !== 0) {
        const imgH = bgCanvas.height;
        const imgW = imgH * (bgImage.naturalWidth / bgImage.naturalHeight);
        
        bgScrollX = (STATE.distance * 10) % imgW;

        // Draw multiple repeating canvas panels with horizontal flipped blending to completely eliminate cut edges
        bgCtx.save();
        bgCtx.drawImage(bgImage, -bgScrollX, 0, imgW, imgH);
        bgCtx.drawImage(bgImage, -bgScrollX + imgW, 0, imgW, imgH);
        bgCtx.drawImage(bgImage, -bgScrollX + imgW * 2, 0, imgW, imgH);
        bgCtx.restore();

        // Subtle gradient vignette and soft horizontal edge-blending
        const grad = bgCtx.createLinearGradient(0, 0, bgCanvas.width, 0);
        grad.addColorStop(0, 'rgba(128, 14, 56, 0.35)');
        grad.addColorStop(0.12, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(0.88, 'rgba(0, 0, 0, 0)');
        grad.addColorStop(1, 'rgba(128, 14, 56, 0.35)');
        bgCtx.fillStyle = grad;
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      } else {
        const grad = bgCtx.createLinearGradient(0, 0, 0, bgCanvas.height);
        grad.addColorStop(0, '#FF5C98');
        grad.addColorStop(1, '#6E052B');
        bgCtx.fillStyle = grad;
        bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
      }
    }

    /* =========================================================================
       3. THREE.JS ORTHOGRAPHIC CAMERA (Zoomed Out further to ViewSize = 26)
       ========================================================================= */
    const canvas = document.getElementById('webgl');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene = new THREE.Scene();

    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 26; // Further zoomed out for a wide panoramic view
    const camera = new THREE.OrthographicCamera(
      (-viewSize * aspect) / 2,
      (viewSize * aspect) / 2,
      viewSize / 2,
      -viewSize / 2,
      0.1,
      1000
    );
    camera.position.set(0, 4, 20);
    camera.lookAt(0, 4, 0);

    scene.add(new THREE.AmbientLight(0xFFFFFF, 0.9));
    const sun = new THREE.DirectionalLight(0xFFF0DD, 0.95);
    sun.position.set(5, 12, 10);
    scene.add(sun);

    /* =========================================================================
       4. CHARACTER LOADER (`model.glb`)
       ========================================================================= */
    let player = new THREE.Group();
    scene.add(player);
    let mixer = null;
    let runAction = null;
    const clock = new THREE.Clock();

    function createFallbackPinkie() {
      const root = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.8, 24, 20),
        new THREE.MeshStandardMaterial({ color: 0xFFF5E4, roughness: 0.3 })
      );
      body.position.y = 0.8;
      root.add(body);

      const glaze = new THREE.Mesh(
        new THREE.SphereGeometry(0.82, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.45),
        new THREE.MeshStandardMaterial({ color: 0xE83375, roughness: 0.15 })
      );
      glaze.position.y = 0.8;
      root.add(glaze);

      const bootMat = new THREE.MeshStandardMaterial({ color: 0x8C5332 });
      const leftBoot = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.18, 0.35), bootMat);
      leftBoot.position.set(0.25, 0.1, 0);
      const rightBoot = leftBoot.clone();
      rightBoot.position.x = -0.25;
      root.add(leftBoot, rightBoot);

      root.userData = { body, leftBoot, rightBoot };
      return root;
    }

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load('model.glb', (gltf) => {
      scene.remove(player);
      player = gltf.scene;
      
      const box = new THREE.Box3().setFromObject(player);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.0 / maxDim;
      player.scale.setScalar(scale);
      
      player.position.set(0, 0, 0);
      scene.add(player);

      if (gltf.animations && gltf.animations.length > 0) {
        mixer = new THREE.AnimationMixer(player);
        runAction = mixer.clipAction(gltf.animations[0]);
        runAction.play();
      }

      document.getElementById('load-progress').style.width = '100%';
    }, (xhr) => {
      const pct = (xhr.loaded / (xhr.total || 1000000)) * 100;
      document.getElementById('load-progress').style.width = `${Math.min(100, pct)}%`;
    }, (error) => {
      console.warn('model.glb failed or blocked by CORS, using procedural fallback character.', error);
      scene.remove(player);
      player = createFallbackPinkie();
      scene.add(player);
      document.getElementById('load-progress').style.width = '100%';
    });

    /* =========================================================================
       5. GAME STATE & INCREASED SPEED MOMENTUM
       ========================================================================= */
    const STATE = {
      active: false,
      distance: 0,
      lives: 3,
      boosts: 2,
      strawberriesCollected: 0,
      speed: 21.0, // Increased overall running speed
      baseSpeed: 21.0,
      isGrounded: true,
      velocityY: 0,
      slowTimer: 0
    };

    const platforms = [];
    const hazards = [];
    const pickups = [];

    const brownieMat = new THREE.MeshStandardMaterial({ color: 0x3C1B0E, roughness: 0.6 });
    const whiteFrostMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.2 });
    const gummyBearMat = new THREE.MeshStandardMaterial({ color: 0xFF0054, roughness: 0.2, metalness: 0.1 });
    const stickyPuddleMat = new THREE.MeshStandardMaterial({ color: 0x480CA8, roughness: 0.05 });
    const lollipopMat = new THREE.MeshStandardMaterial({ color: 0x4CC9F0, roughness: 0.3 });
    const strawbMat = new THREE.MeshStandardMaterial({ color: 0xE83375, roughness: 0.2 });
    const milkMat = new THREE.MeshStandardMaterial({ color: 0xFFFFFF, roughness: 0.1, transparent: true, opacity: 0.9 });

    function spawnPlatform(x, width, y) {
      const group = new THREE.Group();
      
      const slabGeo = new THREE.BoxGeometry(width, 1.2, 2.0);
      const slab = new THREE.Mesh(slabGeo, brownieMat);
      group.add(slab);

      const topGeo = new THREE.BoxGeometry(width, 0.15, 2.02);
      const top = new THREE.Mesh(topGeo, whiteFrostMat);
      top.position.y = 0.65;
      group.add(top);

      group.position.set(x + width / 2, y, 0);
      group.userData = { width, xStart: x, xEnd: x + width, yTop: y + 0.72 };
      scene.add(group);
      platforms.push(group);

      if (width > 4.2 && Math.random() > 0.25) {
        const randObs = Math.random();
        if (randObs < 0.35) {
          const bearGroup = new THREE.Group();
          const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), gummyBearMat);
          head.position.y = 0.5;
          const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.7, 12), gummyBearMat);
          torso.position.y = 0.0;
          bearGroup.add(head, torso);
          bearGroup.position.set(x + width * 0.5, y + 1.1, 0);
          bearGroup.userData = { type: 'hurdle', radius: 0.6 };
          scene.add(bearGroup);
          hazards.push(bearGroup);
        } else if (randObs < 0.7) {
          const pudGeo = new THREE.CylinderGeometry(0.9, 0.9, 0.12, 16);
          const pud = new THREE.Mesh(pudGeo, stickyPuddleMat);
          pud.position.set(x + width * 0.4, y + 0.76, 0);
          pud.userData = { type: 'puddle', radius: 0.9 };
          scene.add(pud);
          hazards.push(pud);
        } else {
          const popGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.2, 20);
          const pop = new THREE.Mesh(popGeo, lollipopMat);
          pop.rotation.x = Math.PI / 2;
          pop.position.set(x + width * 0.5, y + 1.7, 0);
          pop.userData = { type: 'hurdle', radius: 0.7 };
          scene.add(pop);
          hazards.push(pop);
        }
      }

      if (Math.random() > 0.3) {
        if (Math.random() > 0.3) {
          const strawbGeo = new THREE.SphereGeometry(0.32, 12, 12);
          const sMesh = new THREE.Mesh(strawbGeo, strawbMat);
          sMesh.scale.set(1, 1.25, 1);
          sMesh.position.set(x + width * 0.45, y + 1.8, 0);
          sMesh.userData = { type: 'strawberry' };
          scene.add(sMesh);
          pickups.push(sMesh);
        } else {
          const bGeo = new THREE.CylinderGeometry(0.22, 0.28, 0.7, 12);
          const bMesh = new THREE.Mesh(bGeo, milkMat);
          bMesh.position.set(x + width * 0.5, y + 1.9, 0);
          bMesh.userData = { type: 'bottle' };
          scene.add(bMesh);
          pickups.push(bMesh);
        }
      }
    }

    let nextSpawnX = -5;
    spawnPlatform(nextSpawnX, 16, 0);
    nextSpawnX += 16;

    function buildNextTrackSegments() {
      while (nextSpawnX < camera.position.x + 38) {
        const gap = 1.8 + Math.random() * 2.8;
        const width = 4.5 + Math.random() * 5.5;
        const height = (Math.random() - 0.5) * 2.2;
        spawnPlatform(nextSpawnX + gap, width, height);
        nextSpawnX += gap + width;
      }
    }

    /* =========================================================================
       6. CONTROLS & ACTIONS
       ========================================================================= */
    function doJump() {
      if (!STATE.active) return;
      if (STATE.isGrounded) {
        STATE.velocityY = 17.5; // High jump impulse matching high speed
        STATE.isGrounded = false;
        sound.playJump();
      }
    }

    function doBoost() {
      if (!STATE.active || STATE.boosts <= 0) return;
      STATE.boosts--;
      STATE.speed = 34.0;
      sound.playPickup();
      setTimeout(() => {
        STATE.speed = STATE.baseSpeed;
      }, 1200);
      updateHud();
    }

    const btnJump = document.getElementById('btn-jump');
    const btnBoost = document.getElementById('btn-boost');

    btnJump.addEventListener('pointerdown', (e) => { e.preventDefault(); doJump(); });
    btnBoost.addEventListener('pointerdown', (e) => { e.preventDefault(); doBoost(); });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'ArrowUp') {
        if (!e.repeat) doJump();
      }
      if (e.code === 'KeyD' || e.code === 'ArrowRight') {
        doBoost();
      }
    });

    /* =========================================================================
       7. GAME LOOP & RENDERING
       ========================================================================= */
    function updateHud() {
      document.getElementById('distance-ui').innerText = `${Math.floor(STATE.distance)}m`;
      document.getElementById('boost-ui').innerText = STATE.boosts;
      
      const hearts = document.querySelectorAll('.heart-icon');
      hearts.forEach((h, idx) => {
        h.classList.toggle('lost', idx >= STATE.lives);
      });

      btnBoost.classList.toggle('disabled', STATE.boosts <= 0);
    }

    function hitHazard() {
      STATE.lives--;
      sound.playCrash();
      updateHud();
      if (STATE.lives <= 0) {
        triggerGameOver();
      }
    }

    function triggerGameOver() {
      STATE.active = false;
      document.getElementById('final-dist').innerText = `${Math.floor(STATE.distance)}m`;
      document.getElementById('final-strawberries').innerText = STATE.strawberriesCollected;
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    function resetGame() {
      STATE.distance = 0;
      STATE.lives = 3;
      STATE.boosts = 2;
      STATE.strawberriesCollected = 0;
      STATE.speed = STATE.baseSpeed;
      STATE.isGrounded = true;
      STATE.velocityY = 0;
      STATE.slowTimer = 0;

      platforms.forEach(p => scene.remove(p));
      hazards.forEach(h => scene.remove(h));
      pickups.forEach(p => scene.remove(p));
      platforms.length = 0;
      hazards.length = 0;
      pickups.length = 0;

      player.position.set(0, 3, 0);
      nextSpawnX = -5;
      spawnPlatform(nextSpawnX, 16, 0);
      nextSpawnX += 16;

      document.getElementById('gameover-modal').style.display = 'none';
      STATE.active = true;
      updateHud();
    }

    document.getElementById('retry-btn').addEventListener('click', resetGame);

    function animate() {
      requestAnimationFrame(animate);

      const delta = Math.min(clock.getDelta(), 0.1);

      if (mixer) mixer.update(delta);

      renderBackground();

      if (STATE.active) {
        let currentSpeed = STATE.speed;
        if (STATE.slowTimer > 0) {
          STATE.slowTimer -= delta;
          currentSpeed *= 0.5;
        }

        const moveDist = currentSpeed * delta;
        player.position.x += moveDist;
        STATE.distance += moveDist * 0.35;

        // Gravity
        STATE.velocityY += -45.0 * delta;
        player.position.y += STATE.velocityY * delta;

        // Platform Collisions
        STATE.isGrounded = false;
        for (let p of platforms) {
          const data = p.userData;
          if (player.position.x >= data.xStart - 0.4 && player.position.x <= data.xEnd + 0.4) {
            if (player.position.y <= data.yTop + 1.1 && player.position.y >= data.yTop && STATE.velocityY <= 0) {
              player.position.y = data.yTop + 1.1;
              STATE.velocityY = 0;
              STATE.isGrounded = true;
              break;
            }
          }
        }

        if (player.position.y < -8) {
          triggerGameOver();
        }

        // Obstacles Collision
        for (let i = hazards.length - 1; i >= 0; i--) {
          const h = hazards[i];
          h.rotation.z += 2.5 * delta;
          const dist = player.position.distanceTo(h.position);
          if (dist < 1.1) {
            if (h.userData.type === 'puddle') {
              STATE.slowTimer = 1.3;
              sound.playCrash();
            } else if (h.userData.type === 'hurdle') {
              hitHazard();
              scene.remove(h);
              hazards.splice(i, 1);
            }
          }
        }

        // Pickups Collision
        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.rotation.y += 3 * delta;
          if (player.position.distanceTo(p.position) < 1.3) {
            if (p.userData.type === 'strawberry') {
              STATE.strawberriesCollected++;
              if (STATE.boosts < 3) STATE.boosts++;
            } else {
              STATE.lives = Math.min(3, STATE.lives + 1);
            }
            sound.playPickup();
            scene.remove(p);
            pickups.splice(i, 1);
            updateHud();
          }
        }

        // Camera Tracking
        camera.position.x = player.position.x + 3.5;

        buildNextTrackSegments();
        for (let i = platforms.length - 1; i >= 0; i--) {
          if (platforms[i].userData.xEnd < camera.position.x - 24) {
            scene.remove(platforms[i]);
            platforms.splice(i, 1);
          }
        }

        updateHud();
      }

      renderer.render(scene, camera);
    }

    // Responsive Resize
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const asp = w / h;
      camera.left = (-viewSize * asp) / 2;
      camera.right = (viewSize * asp) / 2;
      camera.top = viewSize / 2;
      camera.bottom = -viewSize / 2;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      resizeBg();
    });

    // Loading Simulation
    const progressBar = document.getElementById('load-progress');
    const startBtn = document.getElementById('start-btn');
    let loadProgress = 0;

    const loadInterval = setInterval(() => {
      loadProgress += 20;
      progressBar.style.width = `${Math.min(100, loadProgress)}%`;
      if (loadProgress >= 100) {
        clearInterval(loadInterval);
        document.querySelector('.progress-bar-container').style.display = 'none';
        startBtn.style.display = 'block';
      }
    }, 40);

    // Start Button Trigger
    startBtn.addEventListener('click', () => {
      sound.init();
      sound.startBGM();
      const splash = document.getElementById('loading-screen');
      splash.style.opacity = '0';
      setTimeout(() => { splash.style.display = 'none'; }, 500);
      resetGame();
    });

    animate();
  </script>
</body>
</html>
